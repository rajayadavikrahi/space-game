<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>VOID RUNNER</title>

    <link
        rel="stylesheet"
        href="style.css"
    >
</head>

<body>

    <div id="gameContainer">

        <div id="hud">

            <div>
                SCORE:
                <span id="score">
                    0
                </span>
            </div>

        </div>

        <canvas
            id="gameCanvas"
            width="900"
            height="600"
        ></canvas>

        <!-- START SCREEN -->

        <div
            id="startScreen"
            class="overlay"
        >

            <h1>
                VOID RUNNER
            </h1>

            <p>
                Collect energy.
                Avoid the enemies.
            </p>

            <button id="startButton">
                START GAME
            </button>

        </div>

        <!-- GAME OVER -->

        <div
            id="gameOverScreen"
            class="overlay hidden"
        >

            <h1>
                GAME OVER
            </h1>

            <p>
                Score:
                <span id="finalScore">
                    0
                </span>
            </p>

            <button id="restartButton">
                PLAY AGAIN
            </button>

        </div>

    </div>

    <script
        src="game.js"
    ></script>

</body>
</html>
